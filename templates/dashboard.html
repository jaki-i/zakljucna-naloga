<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');

        :root {
            --primary: #2828ad;
            --secondary: #5d73b1;
            --accent: #b2c6ff;
            --accent2: #4ecdc4;
            --text: #333;
            --light: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, var(--primary), var(--secondary));
            background-size: 400% 400%;
            animation: gradient 30s ease infinite;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 3.5rem;
            border-radius: 1.5rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 90%;
        }

        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 2.8rem;
            animation: logo-appear 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(-20px);
        }

        @keyframes logo-appear {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            display: inline-block;
            position: relative;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 1.5rem;
            animation: welcome-appear 1s ease-out forwards;
            opacity: 0;
            transform: translateY(-10px);
        }

        @keyframes welcome-appear {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-part-meet {
            color: var(--light);
            background: linear-gradient(120deg, var(--light) 30%, rgba(255, 255, 255, 0.8));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-part-ko {
            color: var(--accent2);
            background: linear-gradient(120deg, var(--accent2) 30%, #2fc2ef);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-message {
            margin-bottom: 2.5rem;
            animation: message-appear 0.8s ease-out forwards;
            animation-delay: 0.3s;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes message-appear {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: center;
        }

        .btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 1.1rem 2.5rem;
            border-radius: 3rem;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            min-width: 200px;
        }

        .btn-main {
            animation: button-appear 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 0.8s;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
        }

        .btn-logout {
            animation: button-appear 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 1s;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
        }

        @keyframes button-appear {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: linear-gradient(45deg, var(--accent), var(--accent2));
            opacity: 0;
            transform: scaleX(0);
            transform-origin: right;
        }
        
        .btn:hover {
            color: white;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
            border-color: transparent;
        }

        .btn:hover::before {
            opacity: 1;
            transform: scaleX(1);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            100% {
                transform: scale(20, 20);
                opacity: 0;
            }
        }

        .btn:active::after {
            animation: ripple 0.6s ease-out;
        }

        .btn .icon {
            margin-left: 10px;
            opacity: 0;
            transition: all 0.3s ease;
            transform: translateX(-5px);
        }

        .btn:hover .icon {
            opacity: 1;
            transform: translateX(0);
        }

        .btn-main {
            background: rgba(78, 205, 196, 0.2);
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.1);
        }

        .circles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .circles li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            animation: animate 40s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }

        .circles li:nth-child(1) {
            left: 25%;
            width: 80px;
            height: 80px;
            animation-delay: 0s;
        }

        .circles li:nth-child(2) {
            left: 10%;
            width: 20px;
            height: 20px;
            animation-delay: 2s;
            animation-duration: 25s;
        }

        .circles li:nth-child(3) {
            left: 70%;
            width: 20px;
            height: 20px;
            animation-delay: 4s;
        }

        .circles li:nth-child(4) {
            left: 40%;
            width: 60px;
            height: 60px;
            animation-delay: 0s;
            animation-duration: 30s;
        }

        .circles li:nth-child(5) {
            left: 65%;
            width: 20px;
            height: 20px;
            animation-delay: 0s;
        }

        .circles li:nth-child(6) {
            left: 75%;
            width: 110px;
            height: 110px;
            animation-delay: 3s;
        }

        .circles li:nth-child(7) {
            left: 35%;
            width: 150px;
            height: 150px;
            animation-delay: 7s;
        }

        .circles li:nth-child(8) {
            left: 50%;
            width: 25px;
            height: 25px;
            animation-delay: 15s;
            animation-duration: 60s;
        }

        .circles li:nth-child(9) {
            left: 20%;
            width: 15px;
            height: 15px;
            animation-delay: 2s;
            animation-duration: 55s;
        }

        .circles li:nth-child(10) {
            left: 85%;
            width: 150px;
            height: 150px;
            animation-delay: 0s;
            animation-duration: 35s;
        }

        @keyframes animate {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 0;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        .glowing-dots {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .glowing-dots div {
            position: absolute;
            display: block;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: glowing 10s linear infinite;
        }

        @keyframes glowing {
            0% {
                transform: scale(1);
                opacity: 0;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .glowing-dots div:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .glowing-dots div:nth-child(2) {
            top: 70%;
            left: 30%;
            animation-delay: 3s;
        }

        .glowing-dots div:nth-child(3) {
            top: 40%;
            left: 60%;
            animation-delay: 6s;
        }

        .glowing-dots div:nth-child(4) {
            top: 80%;
            left: 80%;
            animation-delay: 9s;
        }
    </style>
</head>

<body>
    <div class="glowing-dots">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
    
    <ul class="circles">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <div class="container">
        <div class="logo-container">
            <h1><span class="logo-part-meet">meet</span><span class="logo-part-ko">ko</span></h1>
        </div>
        
        <div class="welcome-message">
            <p>Hello, you are logged in.</p>
        </div>
        
        <div class="btn-container">
            <a href="{{url_for('glavna')}}" class="btn btn-main">Continue to main page <span class="icon">→</span></a>
            <a href="{{url_for('logout')}}" class="btn btn-logout">Logout <span class="icon">↑</span></a>
        </div>
    </div>
</body>

</html>

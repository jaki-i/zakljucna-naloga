<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');

        :root {
            --primary: #2828ad;
            --secondary: #5d73b1;
            --accent: #b2c6ff;
            --accent2: #4ecdc4;
            --text: #333;
            --light: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, var(--primary), var(--secondary));
            background-size: 400% 400%;
            animation: gradient 30s ease infinite; /* Slowed down animation */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 3.5rem;
            border-radius: 1.5rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transform: translateY(0);
            animation: gentlefloat 20s ease-in-out infinite; /* Much slower, subtle float */
            max-width: 500px;
            width: 90%;
        }

        @keyframes gentlefloat {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px); /* Reduced movement */
            }
            100% {
                transform: translateY(0px);
            }
        }

        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 2.8rem;
        }

        h1 {
            font-size: 5.2rem; /* Larger font */
            font-weight: 800; /* Bolder */
            letter-spacing: 4px;
            display: inline-block;
            position: relative;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2); /* Added shadow for depth */
        }

        /* Split colored logo */
        .logo-part-meet {
            color: var(--light);
            background: linear-gradient(120deg, var(--light) 30%, rgba(255, 255, 255, 0.8));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-part-ko {
            color: var(--accent2);
            background: linear-gradient(120deg, var(--accent2) 30%, #2fc2ef);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Dotted route line with wave animation */
        .route-line {
            position: absolute;
            left: 0;
            bottom: -20px;
            width: 100%;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .route-path {
            position: relative;
            width: 80%;
            height: 3px;
            background: repeating-linear-gradient(
                to right,
                rgba(255, 255, 255, 0.3) 0,
                rgba(255, 255, 255, 0.3) 5px,
                transparent 5px,
                transparent 10px
            );
            border-radius: 3px;
            overflow: hidden;
        }

        .route-wave {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            animation: wave-motion 3s infinite linear;
        }

        @keyframes wave-motion {
            0% {
                transform: translateX(-100%) scaleX(1);
            }
            50% {
                transform: translateX(0%) scaleX(1.5);
            }
            100% {
                transform: translateX(100%) scaleX(1);
            }
        }

        /* Location pins */
        .pin-start, .pin-end {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            bottom: -4px;
            z-index: 5;
            box-shadow: 0 0 10px var(--accent);
        }

        .pin-start {
            left: 10%;
        }

        .pin-end {
            right: 10%;
            background: var(--accent2);
            box-shadow: 0 0 15px var(--accent2);
            animation: pulse 2s infinite;
        }

        /* Waypoint symbol at the end of route */
        .pin-end {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent2);
            right: 10%;
            bottom: -8px;
            box-shadow: 0 0 15px var(--accent2);
            animation: pulse 2s infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pin-end::before {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 10px var(--accent2);
            }
            50% {
                transform: scale(1.3);
                box-shadow: 0 0 20px var(--accent2);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 10px var(--accent2);
            }
        }

        .tagline {
            font-size: 1.1rem;
            font-weight: 300;
            margin-bottom: 2.5rem;
            opacity: 0.9;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
        }

        /* New button styles with improved animations */
        .btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 1.1rem 2.5rem;
            border-radius: 3rem;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: linear-gradient(45deg, var(--accent), var(--accent2));
            opacity: 0;
            transform: scaleX(0);
            transform-origin: right;
        }

        .btn:hover {
            color: white;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
            border-color: transparent;
        }

        .btn:hover::before {
            opacity: 1;
            transform: scaleX(1);
        }

        /* Fixed button icon animation with proper display */
        .btn-login, .btn-register {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 1.5rem 1.1rem 2.5rem;
        }

        .btn-login .icon, .btn-register .icon {
            margin-left: 10px;
            opacity: 0;
            transition: all 0.3s ease;
            transform: translateX(-5px);
        }

        .btn:hover .icon {
            opacity: 1;
            transform: translateX(0);
        }

        /* Hover glow effect */
        .btn-login:hover {
            box-shadow: 0 10px 25px rgba(184, 247, 255, 0.603);
        }

        .btn-register:hover {
            box-shadow: 0 10px 25px rgba(184, 247, 255, 0.603);
        }

        /* Background circles - slower and less movement */
        .circles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .circles li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            animation: animate 40s linear infinite; /* Slowed down */
            bottom: -150px;
            border-radius: 50%;
        }

        .circles li:nth-child(1) {
            left: 25%;
            width: 80px;
            height: 80px;
            animation-delay: 0s;
        }

        .circles li:nth-child(2) {
            left: 10%;
            width: 20px;
            height: 20px;
            animation-delay: 2s;
            animation-duration: 25s; /* Slowed down */
        }

        .circles li:nth-child(3) {
            left: 70%;
            width: 20px;
            height: 20px;
            animation-delay: 4s;
        }

        .circles li:nth-child(4) {
            left: 40%;
            width: 60px;
            height: 60px;
            animation-delay: 0s;
            animation-duration: 30s; /* Slowed down */
        }

        .circles li:nth-child(5) {
            left: 65%;
            width: 20px;
            height: 20px;
            animation-delay: 0s;
        }

        .circles li:nth-child(6) {
            left: 75%;
            width: 110px;
            height: 110px;
            animation-delay: 3s;
        }

        .circles li:nth-child(7) {
            left: 35%;
            width: 150px;
            height: 150px;
            animation-delay: 7s;
        }

        .circles li:nth-child(8) {
            left: 50%;
            width: 25px;
            height: 25px;
            animation-delay: 15s;
            animation-duration: 60s; /* Slowed down */
        }

        .circles li:nth-child(9) {
            left: 20%;
            width: 15px;
            height: 15px;
            animation-delay: 2s;
            animation-duration: 55s; /* Slowed down */
        }

        .circles li:nth-child(10) {
            left: 85%;
            width: 150px;
            height: 150px;
            animation-delay: 0s;
            animation-duration: 35s; /* Slowed down */
        }

        @keyframes animate {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 0;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        /* Fewer glowing particles with slower movement */
        .glowing-dots {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .glowing-dots div {
            position: absolute;
            display: block;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: glowing 10s linear infinite; /* Slowed down */
        }

        @keyframes glowing {
            0% {
                transform: scale(1);
                opacity: 0;
            }
            50% {
                opacity: 0.5; /* Reduced opacity */
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        /* Fewer glowing dots */
        .glowing-dots div:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .glowing-dots div:nth-child(2) {
            top: 70%;
            left: 30%;
            animation-delay: 3s;
        }

        .glowing-dots div:nth-child(3) {
            top: 40%;
            left: 60%;
            animation-delay: 6s;
        }

        .glowing-dots div:nth-child(4) {
            top: 80%;
            left: 80%;
            animation-delay: 9s;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            opacity: 0.7;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="glowing-dots">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
    
    <ul class="circles">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <div class="container">
        <div class="logo-container">
            <h1><span class="logo-part-meet">meet</span><span class="logo-part-ko">ko</span></h1>
            <div class="route-line">
                <div class="pin-start"></div>
                <div class="route-path">
                    <div class="route-wave"></div>
                </div>
                <div class="pin-end"></div>
            </div>
        </div>
        <p class="tagline">Meet with people who share your passions</p>
        <div class="btn-container">
            <a href="{{ url_for('login') }}" class="btn btn-login">Sign in <span class="icon">→</span></a>
            <a href="{{ url_for('register') }}" class="btn btn-register">Join now <span class="icon">+</span></a>
        </div>
    </div>
</body>

</html>
